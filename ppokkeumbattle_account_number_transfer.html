<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>뻐끔뻐끔 배틀 - 계정 이동</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#05253a;color:#fff}
button,input{font:inherit}button{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}
#app{min-height:100%;background:linear-gradient(#07324b,#087da4);padding:15px 12px 28px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:24px;margin:8px 0}.card{background:#06263cdd;border:1px solid #ffffff22;border-radius:18px;padding:14px;margin:10px 0}
#fishPreview{height:260px;display:flex;align-items:center;justify-content:center;font-size:145px;filter:drop-shadow(0 10px 7px #0007)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#0004;border-radius:10px;padding:9px;text-align:center}
#fishList{display:flex;gap:9px;overflow:auto;padding:6px 0}.fish{min-width:90px;background:#0004;color:#fff;border:2px solid #ffffff22}.fish.sel{border-color:#ffd34e}.fish.lock{filter:brightness(.35)}
.overlay{position:fixed;inset:0;background:#001522ee;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal{width:min(480px,100%);background:#082c43;border-radius:20px;padding:18px;border:1px solid #ffffff33}
input{width:100%;padding:13px;border:0;border-radius:11px;margin:7px 0;color:#111}
.small{font-size:12px;opacity:.75}.danger{background:#a63a3a;color:#fff}.ok{background:#fff;color:#07304a}.gold{background:#ffd34e;color:#173000}
#toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111d;padding:12px 16px;border-radius:12px;z-index:50;display:none}
</style>
</head>
<body>
<div id="app">
<header><h1>🐟 뻐끔뻐끔 배틀</h1><button onclick="openAccount()">☁️ 계정</button></header>
<div class="card">
  <div id="fishPreview">🐟</div>
  <div style="text-align:center"><b id="fishName">기본 물고기</b><div class="small">선택한 물고기</div></div>
</div>
<div class="stats">
 <div class="stat">레벨<br><b id="lv">1</b></div>
 <div class="stat">코인<br><b id="coins">0</b></div>
 <div class="stat">물고기<br><b id="unlocked">1</b></div>
</div>
<div class="card"><b>🐠 물고기 목록</b><div id="fishList"></div></div>
<div style="text-align:center"><button class="gold" onclick="toast('⚔️ 전투 시작!')">⚔️ 선택한 물고기로 시작</button></div>
</div>

<div id="accountOverlay" class="overlay" style="display:none">
 <div class="modal">
  <h2>☁️ 계정 이동</h2>
  <p>기존 기기에서 만든 <b>계정 이동 번호</b>를 새 기기에 입력하면 게임 데이터를 옮길 수 있어.</p>
  <button class="gold" style="width:100%" onclick="showTransfer('make')">📤 이동 번호 만들기</button>
  <button class="ok" style="width:100%;margin-top:8px" onclick="showTransfer('use')">📥 이동 번호 입력</button>
  <button style="width:100%;margin-top:8px" onclick="closeAccount()">닫기</button>
 </div>
</div>

<div id="transferOverlay" class="overlay" style="display:none">
 <div class="modal">
  <h2 id="transferTitle"></h2>
  <div id="transferBody"></div>
  <button style="width:100%;margin-top:8px" onclick="closeTransfer()">닫기</button>
 </div>
</div>
<div id="toast"></div>

<script>
const KEY='ppokkeumbattle_account_v2';
const fishes=[['🐟','기본 물고기',1],['🐠','파란 물고기',2],['🐡','복어',4],['🦈','상어',8],['🐋','고래',15],['🐉','보스 물고기',30]];
let state=load()||{nickname:'플레이어',level:1,coins:100,unlocked:1,selected:0,exp:0};

function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function render(){
 document.getElementById('lv').textContent=state.level;
 document.getElementById('coins').textContent=state.coins;
 document.getElementById('unlocked').textContent=state.unlocked;
 const f=fishes[state.selected]||fishes[0];
 document.getElementById('fishPreview').textContent=state.selected<state.unlocked?f[0]:'❓';
 document.getElementById('fishName').textContent=state.selected<state.unlocked?f[1]:'???';
 const list=document.getElementById('fishList'); list.innerHTML='';
 fishes.forEach((f,i)=>{
   const b=document.createElement('button'); b.className='fish '+(i===state.selected?'sel ':'')+(i>=state.unlocked?'lock':'');
   b.innerHTML=(i<state.unlocked?f[0]:'❓')+'<br><span class="small">'+(i<state.unlocked?f[1]:'???')+'</span>';
   b.onclick=()=>{if(i<state.unlocked){state.selected=i;save()}else toast('🔒 아직 해제되지 않았어!')};
   list.appendChild(b);
 });
}
function openAccount(){document.getElementById('accountOverlay').style.display='flex'}
function closeAccount(){document.getElementById('accountOverlay').style.display='none'}
function closeTransfer(){document.getElementById('transferOverlay').style.display='none'}
function showTransfer(mode){
 document.getElementById('accountOverlay').style.display='none';
 document.getElementById('transferOverlay').style.display='flex';
 const t=document.getElementById('transferTitle'), b=document.getElementById('transferBody');
 if(mode==='make'){
   const num=makeNumber(state);
   t.textContent='📤 내 계정 이동 번호';
   b.innerHTML='<p>이 번호를 새 기기에 입력하면 현재 계정 데이터가 이동돼.</p>'+
     '<input id="generated" readonly value="'+num+'" style="font-size:19px;text-align:center;letter-spacing:1px">'+
     '<button class="gold" style="width:100%" onclick="copyNumber()">📋 번호 복사</button>'+
     '<p class="small">이 번호에는 게임 데이터가 들어 있으니 다른 사람에게 공개하지 마.</p>';
 }else{
   t.textContent='📥 계정 이동 번호 입력';
   b.innerHTML='<input id="importNumber" inputmode="numeric" placeholder="계정 이동 번호를 입력하세요">'+
     '<button class="gold" style="width:100%" onclick="importNumber()">🔗 계정 이동</button>'+
     '<p class="small">기존 기기에서 만든 번호를 입력해.</p>';
 }
}
function bytesToBigInt(bytes){let h='';for(const x of bytes)h+=x.toString(16).padStart(2,'0');return BigInt('0x'+(h||'00'))}
function bigIntToBytes(n){
 let h=n.toString(16); if(h.length%2)h='0'+h;
 const a=[];for(let i=0;i<h.length;i+=2)a.push(parseInt(h.slice(i,i+2),16));return new Uint8Array(a)
}
function makeNumber(obj){
 const bytes=new TextEncoder().encode(JSON.stringify(obj));
 return bytesToBigInt(bytes).toString(10);
}
function importNumber(){
 const s=(document.getElementById('importNumber')?.value||'').replace(/\s/g,'');
 if(!/^[0-9]+$/.test(s)){toast('❌ 숫자만 입력해 줘.');return}
 try{
   const txt=new TextDecoder().decode(bigIntToBytes(BigInt(s)));
   const d=JSON.parse(txt);
   if(!d||typeof d.level!=='number'||typeof d.coins!=='number'||typeof d.unlocked!=='number')throw 0;
   state={nickname:d.nickname||'플레이어',level:d.level,coins:d.coins,unlocked:Math.max(1,Math.min(fishes.length,d.unlocked)),selected:Math.max(0,Math.min(fishes.length-1,d.selected||0)),exp:d.exp||0};
   if(state.selected>=state.unlocked)state.selected=0;
   save();closeTransfer();toast('✅ 계정 이동 완료!');
 }catch(e){toast('❌ 올바른 계정 이동 번호가 아니야.')}
}
async function copyNumber(){
 const v=document.getElementById('generated').value;
 try{await navigator.clipboard.writeText(v);toast('📋 번호를 복사했어!')}catch(e){toast('번호를 길게 눌러 복사해 줘.')}
}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',1800)}
render();
</script>
</body>
</html>

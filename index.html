<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>뻐끔뻐끔 배틀 · 캐릭터 업데이트</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05253a;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#087da4}
#hud{position:fixed;top:8px;left:8px;right:8px;z-index:3;display:flex;gap:6px;flex-wrap:wrap}
.pill{background:#06263ddd;border:1px solid #ffffff3d;border-radius:13px;padding:7px 9px;font-size:12px;font-weight:900}
#top{position:fixed;right:8px;top:55px;z-index:5;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
button{border:0;border-radius:11px;padding:9px 11px;font-weight:900;background:#fff;color:#07304a}
#joy{position:fixed;left:20px;bottom:20px;width:122px;height:122px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55;z-index:4}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffffaa}
#attack{position:fixed;right:22px;bottom:28px;width:94px;height:94px;border-radius:50%;background:#ffd34e;color:#4d3500;font-size:18px;z-index:4}
#panel{display:none;position:fixed;inset:6%;z-index:10;background:#06263cf7;border:1px solid #ffffff55;border-radius:22px;padding:17px;overflow:auto}
#panel h2{margin:0 0 10px}.close{float:right}.card{display:inline-block;vertical-align:top;width:145px;margin:5px;padding:10px;border-radius:14px;background:#ffffff10;border:1px solid #ffffff22;min-height:95px}
#toast{display:none;position:fixed;left:50%;top:23%;transform:translateX(-50%);z-index:20;background:#062238ee;border:1px solid #ffffff55;border-radius:16px;padding:14px 18px;text-align:center;font-weight:900}
#start{position:fixed;inset:0;z-index:30;background:linear-gradient(#05283e,#087da4);display:flex;align-items:center;justify-content:center;text-align:center}
.startbox{width:min(92%,520px);padding:25px;border-radius:26px;background:#06263cee;border:1px solid #ffffff44}
.startbox h1{font-size:38px;margin:0 0 5px}.startbox p{line-height:1.55}.startbox button{font-size:18px;padding:13px 22px}
input{width:100%;padding:11px;border-radius:10px;border:0;margin:5px 0}.small{font-size:12px;opacity:.8}
.codebox{font-family:monospace;word-break:break-all;background:#0006;padding:10px;border-radius:10px;font-size:12px;margin:8px 0}
</style>
</head>
<body>
<div id="start"><div class="startbox">
<h1>🐟 뻐끔뻐끔 배틀</h1><p>✨ 캐릭터 물고기 업데이트!</p>
<p>넓은 바닷속을 탐험하고, 20초마다 강해지는 웨이브를 버티세요!</p>
<p class="small">계정 연동 지원 · 게임 닉네임만 사용 · 실명 입력 금지</p>
<input id="nick" placeholder="게임 닉네임을 입력하세요">
<button onclick="startGame()">새로 시작</button>
<button onclick="showRestore()">🔗 계정 복구/연동</button>
</div></div>

<canvas id="game"></canvas>
<div id="hud">
<div class="pill" id="wave">🌊 WAVE 1/80</div><div class="pill" id="timer">⏱️ 20</div>
<div class="pill" id="hp">❤️ 100/100</div><div class="pill" id="xp">⭐ Lv.1 0/100</div>
<div class="pill" id="coins">🪙 0</div>
</div>
<div id="top">
<button onclick="openPanel('account')">👤 계정</button>
<button onclick="openPanel('codex')">📖 도감</button>
<button onclick="openPanel('draw')">🎰 뽑기</button>
<button onclick="openPanel('friends')">👥 친구</button>
<button onclick="openPanel('rank')">🏆 랭킹</button>
<button onclick="openPanel('leader')">👑 리더</button>
<button onclick="openPanel('more')">MORE</button>
</div>
<div id="joy"><div id="knob"></div></div><button id="attack">콱!<br>공격</button>
<div id="panel"></div><div id="toast"></div>

<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W,H;
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
const WORLD={w:4200,h:2500};
let player={x:600,y:1250,r:25,hp:100,max:100,xp:0,lv:1,atk:10,def:0,coins:0,inv:0};
let cam={x:0,y:0},wave=1,remain=20,enemies=[],bubbles=[],spawn=0,bubbleTimer=5,attackCd=0;
let nickname='',started=false,region=1,unlocked=2,drawUsed=false,reviveUsed=false;
let accountId='',recoveryCode='';
const fish=[
['🐟','기본 물고기',10,100,'기본'],['🐠','산호 물고기',12,110,'일반'],['🦈','강철 상어',18,160,'희귀'],
['🐙','심해 문어',20,180,'희귀'],['🪼','해파리 물고기',22,190,'희귀'],['🐡','가시 복어',24,200,'희귀'],
['🐢','거대 바다거북',27,230,'특별'],['🦀','집게 물고기',30,250,'특별'],['🐋','전설의 고래',35,280,'전설'],
['🐉','전설의 해룡',45,330,'스페셜'],['🌊','바다의 주인',52,380,'스페셜'],['🐲','워터 드래곤',60,430,'스페셜'],
['🐍','대지의 주인 · 슈퍼 자이언트 바다뱀',70,480,'스페셜'],['🦑','우주의 주인 · 슈퍼 투명 오징어',82,520,'스페셜'],
['✨','환상의 물고기',100,700,'초희귀']
];

function makeId(){return 'PB-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,7).toUpperCase()}
function pack(obj){return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replaceAll('+','-').replaceAll('/','_').replaceAll('=','')}
function unpack(s){s=s.trim().replaceAll('-','+').replaceAll('_','/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
function saveState(){
 const data={v:1,accountId,nickname,player:{x:player.x,y:player.y,hp:player.hp,max:player.max,xp:player.xp,lv:player.lv,atk:player.atk,def:player.def,coins:player.coins},wave,region,unlocked,drawUsed,reviveUsed,savedAt:new Date().toISOString()};
 recoveryCode=pack(data);
 localStorage.setItem('ppokkeumbattle_account',JSON.stringify(data));
}
function loadData(data){
 if(!data||data.v!==1)throw Error('지원하지 않는 복구 코드');
 accountId=data.accountId||makeId();nickname=data.nickname||'플레이어';
 Object.assign(player,data.player||{});wave=data.wave||1;region=data.region||1;unlocked=data.unlocked||2;drawUsed=!!data.drawUsed;reviveUsed=!!data.reviveUsed;
 recoveryCode=pack(data);started=true;document.querySelector('#start').style.display='none';saveState();toast('🔗 계정 복구 완료!<br>'+nickname+'님');
}
function startGame(){
 nickname=(document.querySelector('#nick').value||'플레이어').trim()||'플레이어';
 const old=localStorage.getItem('ppokkeumbattle_account');
 if(old){try{let d=JSON.parse(old); if(d.nickname===nickname) loadData(d); else newAccount()}catch(e){newAccount()}}
 else newAccount();
}
function newAccount(){accountId=makeId();player={x:600,y:1250,r:25,hp:100,max:100,xp:0,lv:1,atk:10,def:0,coins:0,inv:0};wave=1;region=1;unlocked=2;drawUsed=false;reviveUsed=false;started=true;document.querySelector('#start').style.display='none';saveState();toast('🐟 '+nickname+'님 환영합니다!<br>계정이 자동 저장됩니다.')}
function showRestore(){
 const s='<button class=close onclick=closePanel()>닫기</button><h2>🔗 계정 연동 / 복구</h2><p>다른 기기에서도 아래 복구 코드를 입력하면 저장 데이터를 불러올 수 있어요.</p><input id=restoreCode placeholder="복구 코드를 붙여넣으세요"><button onclick=restoreFromInput()>복구하기</button><p class=small>※ 이 버전은 서버 없이 복구 코드를 이용하는 방식입니다. 코드를 가진 사람이 데이터를 복구할 수 있으니 다른 사람에게 공개하지 마세요.</p>';
 document.querySelector('#panel').innerHTML=s;document.querySelector('#panel').style.display='block'
}
function restoreFromInput(){try{loadData(unpack(document.querySelector('#restoreCode').value));closePanel()}catch(e){toast('❌ 복구 코드가 올바르지 않습니다.')}}
function toast(s){const t=document.querySelector('#toast');t.innerHTML=s;t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',1800)}
function spawnEnemy(){let a=Math.random()*Math.PI*2,d=500+Math.random()*450,x=player.x+Math.cos(a)*d,y=player.y+Math.sin(a)*d;let hp=35+wave*4;enemies.push({x:Math.max(30,Math.min(WORLD.w-30,x)),y:Math.max(30,Math.min(WORLD.h-30,y)),r:22,hp,max:hp,spd:42+wave*.9,atk:6+wave*.42,type:Math.random()<.12?'special':'normal'})}
function bubble(){let a=[[8,5,5],[13,10,5],[18,15,25],[25,30,20]][Math.floor(Math.random()*4)];bubbles.push({x:70+Math.random()*(WORLD.w-140),y:70+Math.random()*(WORLD.h-140),r:a[0],heal:a[1],xp:a[2]})}
function level(){let need=100+(player.lv-1)*40;if(player.xp>=need){player.xp-=need;player.lv++;player.max+=10;player.hp=player.max;player.atk+=1;toast('⭐ LEVEL UP!<br>공격력 +1 · 최대 체력 +10');saveState()}}
function attack(){if(attackCd>0)return;attackCd=.42;let hit=false;for(const e of enemies){if(Math.hypot(e.x-player.x,e.y-player.y)<88){e.hp-=player.atk;hit=true;if(e.hp<=0){player.xp+=12;player.coins+=1;enemies=enemies.filter(q=>q!==e);level()}}}if(hit){toast('콱! 🐟');saveState()}}
document.querySelector('#attack').onpointerdown=attack;
const joy={x:0,y:0};let joyDown=false;const je=document.querySelector('#joy'),kn=document.querySelector('#knob');
function setJoy(e){let r=je.getBoundingClientRect(),x=e.clientX-r.left-61,y=e.clientY-r.top-61,d=Math.hypot(x,y),m=43;if(d>m){x=x/d*m;y=y/d*m}joy.x=x/m;joy.y=y/m;kn.style.transform=`translate(${x}px,${y}px)`}
je.onpointerdown=e=>{joyDown=true;je.setPointerCapture(e.pointerId);setJoy(e)};je.onpointermove=e=>{if(joyDown)setJoy(e)};je.onpointerup=()=>{joyDown=false;joy.x=joy.y=0;kn.style.transform='translate(0,0)'};
function update(dt){
 if(!started)return;
 if(attackCd>0)attackCd-=dt;if(player.inv>0)player.inv-=dt;
 player.x+=joy.x*185*dt;player.y+=joy.y*185*dt;player.x=Math.max(30,Math.min(WORLD.w-30,player.x));player.y=Math.max(30,Math.min(WORLD.h-30,player.y));
 cam.x=Math.max(0,Math.min(WORLD.w-W,player.x-W/2));cam.y=Math.max(0,Math.min(WORLD.h-H,player.y-H/2));
 remain-=dt;if(remain<=0){remain=20;if(wave<80){wave++;toast('🌊 WAVE '+wave+'!<br>적이 더 강해졌습니다!')}else toast('👑 WAVE 80 완료!<br>슈퍼 전설의 레이드 도전!');saveState()}
 spawn-=dt;if(spawn<=0){spawn=Math.max(.5,1.75-wave*.012);spawnEnemy()}
 bubbleTimer-=dt;if(bubbleTimer<=0){bubbleTimer=5;for(let i=0;i<20;i++)bubble()}
 for(const e of enemies){let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;if(d<48&&player.inv<=0)player.hp-=e.atk*dt}
 for(const b of bubbles){if(Math.hypot(b.x-player.x,b.y-player.y)<b.r+player.r){player.hp=Math.min(player.max,player.hp+b.heal);player.xp+=b.xp;b.dead=1;level();saveState()}}
 bubbles=bubbles.filter(b=>!b.dead);
 if(player.hp<=0){if(!reviveUsed&&player.coins>0){player.coins--;reviveUsed=true;player.hp=player.max;player.inv=8;toast('✨ 마지막 부활!<br>8초 동안 무적')}else{player.hp=player.max;player.x=600;player.y=1250;toast('💫 다시 시작!')}saveState()}
}
function drawFish(x,y,dir){
 ctx.save();ctx.translate(x,y);ctx.scale(dir||1,1);
 // Character-style fish body
 ctx.fillStyle='#ffd34e';ctx.beginPath();ctx.ellipse(0,0,38,25,0,0,Math.PI*2);ctx.fill();
 // tail
 ctx.fillStyle='#ff8a3d';ctx.beginPath();ctx.moveTo(31,0);ctx.lineTo(58,-21);ctx.lineTo(58,21);ctx.closePath();ctx.fill();
 // top fin
 ctx.fillStyle='#ffe98a';ctx.beginPath();ctx.moveTo(-7,-21);ctx.quadraticCurveTo(0,-39,14,-20);ctx.closePath();ctx.fill();
 // bottom fin
 ctx.fillStyle='#f6a53d';ctx.beginPath();ctx.moveTo(-8,19);ctx.quadraticCurveTo(2,35,13,19);ctx.closePath();ctx.fill();
 // eye + pupil
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(17,-8,8,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#111';ctx.beginPath();ctx.arc(19,-8,3.2,0,Math.PI*2);ctx.fill();
 // smile
 ctx.strokeStyle='#7a3b12';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(9,4,9,0.15,1.2);ctx.stroke();
 // cheek
 ctx.fillStyle='#ff9a8c';ctx.beginPath();ctx.arc(24,6,3,0,Math.PI*2);ctx.fill();
 ctx.restore()
}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-cam.x,-cam.y);ctx.fillStyle=region===1?'#087da4':'#154b68';ctx.fillRect(0,0,WORLD.w,WORLD.h);
 for(let i=0;i<120;i++){let x=(i*311)%WORLD.w,y=(i*173)%WORLD.h;ctx.fillStyle='#ffffff18';ctx.beginPath();ctx.arc(x,y,2+(i%4),0,7);ctx.fill()}
 for(const b of bubbles){ctx.strokeStyle='#ffffffaa';ctx.fillStyle='#ffffff1c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.stroke()}
 for(const e of enemies){ctx.fillStyle=e.type==='special'?'#b95cff':'#d84b5a';ctx.beginPath();ctx.ellipse(e.x,e.y,e.r+4,e.r,0,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(e.x-25,e.y-37,50,5);ctx.fillStyle='#7cff7c';ctx.fillRect(e.x-25,e.y-37,50*Math.max(0,e.hp/e.max),5)}
 drawFish(player.x,player.y,joy.x<0?-1:1);ctx.restore();
 document.querySelector('#wave').textContent='🌊 WAVE '+wave+'/80';document.querySelector('#timer').textContent='⏱️ '+Math.ceil(remain);document.querySelector('#hp').textContent='❤️ '+Math.max(0,Math.ceil(player.hp))+'/'+player.max;let need=100+(player.lv-1)*40;document.querySelector('#xp').textContent='⭐ Lv.'+player.lv+' '+Math.floor(player.xp)+'/'+need;document.querySelector('#coins').textContent='🪙 '+player.coins;
}
function loop(now){let dt=Math.min(.05,(now-(loop.last||now))/1000);loop.last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);

function openPanel(kind){
 let s='<button class=close onclick=closePanel()>닫기</button>';
 if(kind==='account'){saveState();s+='<h2>👤 계정 정보</h2><p>닉네임: <b>'+esc(nickname)+'</b></p><p>계정 ID: <b>'+esc(accountId)+'</b></p><p>현재 레벨: '+player.lv+' · 코인: '+player.coins+' · 웨이브: '+wave+'</p><h3>🔐 다른 기기로 연동</h3><p>아래 복구 코드를 새 기기에서 입력하세요.</p><div class=codebox>'+esc(recoveryCode)+'</div><button onclick=copyRecovery()>📋 복구 코드 복사</button><p class=small>복구 코드는 계정 비밀번호처럼 취급하세요. 서버에 보내지 않습니다.</p>'}
 if(kind==='codex'){s+='<h2>📖 도감</h2><p>해제: '+unlocked+'/15</p>';fish.forEach((f,i)=>{let ok=i<unlocked;s+=`<div class=card>${ok?f[0]:'❓'} <b>${ok?f[1]:'???'}</b><br><small>${ok?'⚔️ '+f[2]+' · ❤️ '+f[3]:'아직 해제되지 않음'}</small></div>`})}
 if(kind==='draw'){s+='<h2>🎰 하루 한 번 물고기 뽑기</h2><p>하루 1회. 희귀 물고기와 스페셜 카드가 등장합니다.</p><button onclick=drawFishCard()>오늘의 뽑기</button><p class=small>✨ 환상의 물고기 특별 당첨 확률: 0.1%</p>'}
 if(kind==='friends'){s+='<h2>👥 친구 초대 모드</h2><p>게임 닉네임만 사용하세요. 실명 입력 금지.</p><p>실제 온라인 친구 기능은 서버 연결이 필요합니다.</p>'}
 if(kind==='rank'){s+='<h2>🏆 친구 랭킹</h2><ol><li>'+esc(nickname||'나')+' — '+(player.lv*100+wave*10)+'점</li><li>친구 A — 1,240점</li><li>친구 B — 980점</li></ol>'}
 if(kind==='leader'){s+='<h2>👑 리더</h2><p>리더 인증번호를 입력한 사람만 리더가 될 수 있습니다.</p><input id=ownerInput inputmode=numeric maxlength=8 placeholder="8자리 번호 입력"><button onclick=claimLeader()>리더 인증</button>'}
 if(kind==='more'){s+='<h2>MORE</h2><p>📢 공지사항<br>🎪 기간 한정 이벤트<br>🔗 계정 연동/복구<br>🗺️ 지역 선택<br>⚔️ 슈퍼 전설의 물고기 레이드</p><button onclick=region2Mode()>웨이브 백 체험</button>'}
 document.querySelector('#panel').innerHTML=s;document.querySelector('#panel').style.display='block'
}
function closePanel(){document.querySelector('#panel').style.display='none'}
function copyRecovery(){navigator.clipboard?.writeText(recoveryCode).then(()=>toast('📋 복구 코드가 복사됐어요!')).catch(()=>toast('복사할 수 없어요. 코드를 길게 눌러 복사하세요.'))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawFishCard(){if(drawUsed){toast('🎰 오늘 뽑기는 이미 사용했습니다.');return}drawUsed=true;let r=Math.random();if(r<.001){unlocked=15;toast('✨ 0.1% 당첨!<br>환상의 물고기 획득!')}else{let i=Math.floor(Math.random()*14);if(i>=unlocked)unlocked=Math.min(14,i+1);toast('🎉 물고기 획득!<br>'+fish[i][0]+' '+fish[i][1])}saveState();openPanel('draw')}
let isLeader=false;const LEADER_CODE='50974266';
function claimLeader(){const v=(document.querySelector('#ownerInput')?.value||'').trim();if(v===LEADER_CODE){isLeader=true;toast('👑 리더 인증 완료!');openPanel('leader')}else toast('❌ 리더 인증번호가 맞지 않습니다.')}
function region2Mode(){region=2;wave=1;remain=20;enemies=[];saveState();toast('🌊 웨이브 백 진입!<br>이 지역 전용 물고기로 도전');closePanel()}
</script>
</body></html>

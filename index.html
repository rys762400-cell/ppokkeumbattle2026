<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>뻐끔뻐끔 배틀</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Noto Sans KR",sans-serif;background:#06324a;color:#fff}
button{border:0;border-radius:14px;padding:12px 15px;font-weight:800;font-size:15px}
#menu{position:fixed;inset:0;overflow:auto;padding:12px;background:linear-gradient(#06304a,#0783a5);text-align:center}
h1{margin:8px 0 4px;font-size:30px}.bar{display:flex;gap:7px;justify-content:space-between}.bar button{background:#fff;color:#06324a}
.card{margin:9px 0;padding:12px;border-radius:16px;background:#06283ddd;border:1px solid #ffffff25}
input{padding:12px;border:0;border-radius:10px;width:100%;margin:5px 0;font-size:16px}
#fishPreview{font-size:125px;height:175px;display:flex;align-items:center;justify-content:center}
#fishList{display:flex;gap:7px;overflow:auto;padding:5px}.fish{min-width:82px;height:86px;background:#092d43;color:white;border:2px solid #ffffff22}.fish.sel{border-color:#ffd34e}.fish.lock{opacity:.35}
#game{display:none;position:fixed;inset:0;width:100%;height:100%;background:#0783a5}
#hud{display:none;position:fixed;top:7px;left:7px;right:7px;z-index:5;display:flex;gap:5px;flex-wrap:wrap}.hud{background:#06283ddd;border-radius:10px;padding:7px 9px;font-size:12px;font-weight:800}
#joy{display:none;position:fixed;left:18px;bottom:18px;width:120px;height:120px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;z-index:5}
#stick{position:absolute;width:48px;height:48px;border-radius:50%;background:#ffffffaa;left:34px;top:34px}
.ctrl{display:none;position:fixed;z-index:6;width:82px;height:82px;border-radius:50%}
#attack{right:18px;bottom:18px;background:#ffd34e}#skill{right:18px;bottom:115px;background:#d7a5ff}#run{right:115px;bottom:18px;background:#76e6ff}
#modal{display:none;position:fixed;z-index:20;inset:7%;background:#06283cf7;border:1px solid #ffffff55;border-radius:18px;padding:15px;overflow:auto}
#toast{display:none;position:fixed;z-index:50;left:50%;top:18%;transform:translateX(-50%);background:#062238f5;border-radius:14px;padding:12px 16px;font-weight:900}
.small{font-size:12px;opacity:.8}.badge{display:inline-block;padding:4px 7px;border-radius:8px;background:#ffffff15;margin:2px}
</style>
</head>
<body>
<div id="menu">
 <div class="bar"><button onclick="openLeader()">👑 리더 인증</button><button onclick="openAccount()">🔑 복구</button></div>
 <h1>🐟 뻐끔뻐끔 배틀</h1><div class="small">처음에는 기본 물고기 1마리만 해제됩니다.</div>
 <div id="fishPreview">🐟</div><h2 id="name">기본 물고기</h2><div id="stats"></div>
 <div class="card"><b>👤 닉네임</b><input id="nick" maxlength="12" placeholder="닉네임"><button onclick="setNick()">저장</button></div>
 <div class="card"><b>🎲 물고기 뽑기</b><p class="small">10🪙 또는 하루 1회 무료</p><button onclick="draw(false)">🎲 10🪙 뽑기</button> <button onclick="draw(true)">🎁 무료 뽑기</button><div id="coins"></div></div>
 <div class="card"><b>🐠 물고기 수집</b><div id="collection"></div></div>
 <div id="fishList"></div>
 <div class="card"><b>👥 내 동료 5마리</b><div id="team"></div></div>
 <button style="background:#ffd34e" onclick="start()">⚔️ 전투 시작</button>
</div>
<canvas id="game"></canvas>
<div id="hud"><span class="hud" id="hWave"></span><span class="hud" id="hHp"></span><span class="hud" id="hLv"></span><span class="hud" id="hCoin"></span><span class="hud" id="hSkill"></span></div>
<div id="joy"><div id="stick"></div></div>
<button id="run" class="ctrl">💨<br>빨리</button><button id="skill" class="ctrl">✨<br>스킬</button><button id="attack" class="ctrl">⚔️<br>공격</button>
<div id="modal"></div><div id="toast"></div>

<script>
const LEADER_CODE="50974266";
const SAVE_KEY="ppokkeumbattle_clean_v1";
const fish=[
 {e:"🐟",n:"기본 물고기",a:10,h:100,c:"#ffd34e"},{e:"🐠",n:"산호 물고기",a:13,h:115,c:"#4fc3f7"},
 {e:"🐡",n:"복어",a:17,h:130,c:"#ff8a9b"},{e:"🦈",n:"강철 상어",a:23,h:175,c:"#aab7c4"},
 {e:"🐙",n:"심해 문어",a:27,h:195,c:"#b66cff"},{e:"🪼",n:"해파리",a:30,h:210,c:"#7ce7ff"},
 {e:"🐢",n:"바다거북",a:34,h:240,c:"#62d17d"},{e:"🐋",n:"전설 고래",a:45,h:300,c:"#5477ff"},
 {e:"🐉",n:"해룡",a:58,h:370,c:"#35e0c0"},{e:"✨",n:"환상의 물고기",a:85,h:520,c:"#fff"}
];
let state={nick:"플레이어",sel:0,unlocked:1,lv:1,xp:0,coins:50,growth:1,food:0,companions:[0,0,0,0,0],lastFree:"",recovery:""};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s)state={...state,...s}}catch(e){}
if(!state.recovery)state.recovery=makeRecovery();
let running=false,player,enemies=[],allies=[],enemyTeam=[],foods=[],wave=1,timeLeft=20,skillCd=0,attackCd=0,attackAnim=0,run=false;
let saveClock=0,move={x:0,y:0},last=0;
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener("resize",resize);resize();
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display="none",1500)}
function makeRecovery(){return Math.random().toString(36).slice(2,10).toUpperCase()+Math.floor(1000+Math.random()*9000)}
function render(){
 document.getElementById("nick").value=state.nick;
 const f=fish[state.sel], ok=state.sel<state.unlocked;
 document.getElementById("fishPreview").textContent=ok?f.e:"❓";
 document.getElementById("name").textContent=ok?f.n:"???";
 document.getElementById("stats").textContent=ok?`⚔️ ${Math.round(f.a*state.growth)}　❤️ ${Math.round(f.h*state.growth)}　📏 ${state.growth.toFixed(1)}배`:"🔒 잠김";
 document.getElementById("coins").textContent="🪙 "+state.coins;
 document.getElementById("collection").innerHTML=fish.map((x,i)=>`<span class="badge">${i<state.unlocked?x.e+" "+x.n:"❓ ???"}</span>`).join("");
 document.getElementById("team").textContent=state.companions.map(i=>fish[i].e).join(" ");
 const list=document.getElementById("fishList");list.innerHTML="";
 fish.forEach((x,i)=>{const b=document.createElement("button");b.className="fish "+(i==state.sel?"sel ":"")+(i>=state.unlocked?"lock":"");b.innerHTML=(i<state.unlocked?x.e:"❓")+"<br>"+(i<state.unlocked?x.n:"???");b.onclick=()=>{if(i<state.unlocked){state.sel=i;save();render()}else toast("아직 잠긴 물고기야.")};list.appendChild(b)});
}
function setNick(){const v=document.getElementById("nick").value.trim();if(!v)return toast("닉네임을 입력해 줘.");state.nick=v;save();toast("닉네임 저장!")}
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function draw(free){
 if(free&&state.lastFree===today())return toast("오늘 무료 뽑기는 이미 했어.");
 if(!free&&state.coins<10)return toast("코인이 부족해. 오늘 무료 뽑기를 사용해 봐!");
 if(free)state.lastFree=today();else state.coins-=10;
 const i=Math.floor(Math.random()*fish.length);
 if(i>=state.unlocked){state.unlocked=i+1;toast("🎉 "+fish[i].n+" 해제!")}else{state.coins+=free?10:0;toast("🎲 "+fish[i].n+"!")}
 save();render();
}
function start(){
 const f=fish[state.sel];running=true;wave=1;timeLeft=20;skillCd=0;attackCd=0;attackAnim=0;foods=[];enemies=[];enemyTeam=[];
 player={x:innerWidth/2,y:innerHeight/2,r:25*state.growth,hp:f.h*state.growth,max:f.h*state.growth,atk:f.a*state.growth};
 allies=state.companions.map((fi,i)=>({fi,x:300+i*120,y:250+(i%2)*180,r:20,hp:fish[fi].h,max:fish[fi].h,atk:fish[fi].a,tx:300+i*120,ty:250+(i%2)*180,think:0}));
 for(let i=0;i<3;i++)enemyTeam.push({x:200+Math.random()*(innerWidth-400),y:120+Math.random()*200,r:24,hp:180,max:180,atk:16,tx:Math.random()*innerWidth,ty:Math.random()*innerHeight,think:0});
 document.getElementById("menu").style.display="none";canvas.style.display="block";
 ["hud","joy","attack","skill","run"].forEach(id=>document.getElementById(id).style.display=id=="hud"?"flex":"block");
 toast("⚔️ 전투 시작!");
}
function spawn(){
 const side=Math.floor(Math.random()*4),x=side<2?(side?innerWidth-30:30):Math.random()*innerWidth,y=side<2?Math.random()*innerHeight:(side==2?30:innerHeight-30);
 enemies.push({x,y,r:18+Math.random()*8,hp:50+wave*4,max:50+wave*4,atk:7+wave*.4,spd:35+Math.random()*35,tx:Math.random()*innerWidth,ty:Math.random()*innerHeight,think:0,grow:1});
}
function update(dt){
 if(!running)return;
 attackCd=Math.max(0,attackCd-dt);skillCd=Math.max(0,skillCd-dt);attackAnim=Math.max(0,attackAnim-dt);saveClock-=dt;
 const speed=run?300:160;player.x=Math.max(20,Math.min(innerWidth-20,player.x+move.x*speed*dt));player.y=Math.max(20,Math.min(innerHeight-20,player.y+move.y*speed*dt));
 timeLeft-=dt;if(timeLeft<=0){timeLeft=20;if(wave<80)wave++}
 if(Math.random()<dt*.22&&enemies.length<18)spawn();
 // independent allied AI
 for(const a of allies){if(a.hp<=0)continue;a.think-=dt;if(a.think<=0){a.think=1+Math.random()*2;a.tx=Math.random()*innerWidth;a.ty=Math.random()*innerHeight}
  const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy)||1;a.x+=dx/d*75*dt;a.y+=dy/d*75*dt;
  for(const food of foods)if(!food.dead&&Math.hypot(food.x-a.x,food.y-a.y)<a.r+10){food.dead=true;a.r=Math.min(42,a.r*1.03);a.max+=2;a.hp=Math.min(a.max,a.hp+4)}
  for(const e of enemies)if(!e.dead&&Math.hypot(e.x-a.x,e.y-a.y)<75){e.hp-=a.atk*.3*dt;if(e.hp<=0)e.dead=true}
 }
 // autonomous enemies: wander, occasionally choose a nearby target
 for(const e of enemies){if(e.dead)continue;e.think-=dt;if(e.think<=0){e.think=.8+Math.random()*2;e.tx=Math.random()*innerWidth;e.ty=Math.random()*innerHeight}
  let target=null,best=300;if(Math.random()<.25){const ts=[player,...allies.filter(a=>a.hp>0)];for(const t of ts){const d=Math.hypot(t.x-e.x,t.y-e.y);if(d<best){best=d;target=t}}}
  const tx=target?target.x:e.tx,ty=target?target.y:e.ty,dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;
  if(target&&best<45)target.hp-=e.atk*dt;
  // enemies can eat a defeated ally
  for(const a of allies)if(a.hp<=0&&!a.dead&&Math.hypot(a.x-e.x,a.y-e.y)<e.r+12){a.dead=true;e.grow+=.12;e.r=Math.min(48,e.r*1.06);e.max*=1.08;e.hp=e.max;toast("🔴 적이 동료를 먹고 커졌어!")}
 }
 // opposing team AI
 for(const o of enemyTeam){if(o.hp<=0)continue;o.think-=dt;if(o.think<=0){o.think=1+Math.random()*2;o.tx=Math.random()*innerWidth;o.ty=Math.random()*innerHeight}
  const target=Math.random()<.3?player:null,tx=target?target.x:o.tx,ty=target?target.y:o.ty,dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy)||1;o.x+=dx/d*65*dt;o.y+=dy/d*65*dt;
  if(target&&d<55)player.hp-=o.atk*dt;
 }
 enemies=enemies.filter(e=>!e.dead);allies=allies.filter(a=>!a.dead);
 // food
 if(Math.random()<dt*.2&&foods.length<7)foods.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,dead:false});
 for(const f of foods)if(!f.dead&&Math.hypot(f.x-player.x,f.y-player.y)<f.r+18){f.dead=true;state.food++;state.growth=Math.min(2.2,state.growth+.03);player.r=Math.min(45,player.r+1);player.max+=1;player.hp=Math.min(player.max,player.hp+4)}
 foods=foods.filter(f=>!f.dead);
 if(player.hp<=0){running=false;endGame();return}
 if(saveClock<=0){save();saveClock=2}
 document.getElementById("hWave").textContent="🌊 "+wave+"/80";document.getElementById("hHp").textContent="❤️ "+Math.max(0,Math.ceil(player.hp))+"/"+Math.ceil(player.max);document.getElementById("hLv").textContent="⭐ Lv."+state.lv;document.getElementById("hCoin").textContent="🪙 "+state.coins;document.getElementById("hSkill").textContent=skillCd>0?"✨ "+skillCd.toFixed(1):"✨ 준비";
}
function attack(){
 if(!running||attackCd>0)return;
 attackCd=.09;attackAnim=.16;
 for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<105){e.hp-=player.atk;if(e.hp<=0){e.dead=true;state.coins++;state.xp+=10}}
 const need=100+(state.lv-1)*40;if(state.xp>=need){state.xp-=need;state.lv++;state.coins+=5;toast("⭐ 레벨 업!")}
}
function skill(){if(!running||skillCd>0)return;skillCd=8;for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<230){e.hp-=player.atk*4;if(e.hp<=0)e.dead=true}toast("✨ 특수 능력!")}
document.getElementById("attack").onpointerdown=attack;document.getElementById("skill").onpointerdown=skill;
document.getElementById("run").onpointerdown=()=>run=true;document.getElementById("run").onpointerup=()=>run=false;document.getElementById("run").onpointercancel=()=>run=false;
let joyDown=false;const joy=document.getElementById("joy"),stick=document.getElementById("stick");
function joySet(e){const r=joy.getBoundingClientRect();let x=e.clientX-r.left-60,y=e.clientY-r.top-60,d=Math.hypot(x,y)||1,m=43;if(d>m){x=x/d*m;y=y/d*m}move.x=x/m;move.y=y/m;stick.style.transform=`translate(${x}px,${y}px)`}
joy.onpointerdown=e=>{joyDown=true;joy.setPointerCapture(e.pointerId);joySet(e)};joy.onpointermove=e=>{if(joyDown)joySet(e)};joy.onpointerup=()=>{joyDown=false;move.x=move.y=0;stick.style.transform="translate(0,0)"};
function endGame(){["hud","joy","attack","skill","run"].forEach(id=>document.getElementById(id).style.display="none");canvas.style.display="none";document.getElementById("menu").style.display="block";save();render();toast("💫 쓰러졌어! 메인 화면으로 돌아왔어.")}
function openLeader(){
 const p=document.getElementById("modal");p.style.display="block";
 p.innerHTML=`<button style="float:right" onclick="closeModal()">닫기</button><h2>👑 리더 인증</h2><p>리더 번호를 입력하세요.</p><input id="leaderInput" inputmode="numeric" maxlength="8" placeholder="리더 번호"><button onclick="verifyLeader()">👑 인증하기</button>`;
}
function verifyLeader(){const v=(document.getElementById("leaderInput").value||"").replace(/\\D/g,"");if(v===LEADER_CODE){localStorage.setItem("leader_ok","1");document.getElementById("modal").innerHTML='<button style="float:right" onclick="closeModal()">닫기</button><h2>👑 리더 인증 완료!</h2><p style="color:#8dffab;font-weight:900">✅ 인증 성공</p><p>리더 전용 기능을 사용할 수 있습니다.</p><button onclick="toast(\'🤖 업데이트 요청 준비 완료!\')">🤖 AI 업데이트</button>';toast("👑 인증 성공!")}else toast("❌ 리더 번호가 틀렸어.")}
function openAccount(){
 const p=document.getElementById("modal");p.style.display="block";
 p.innerHTML=`<button style="float:right" onclick="closeModal()">닫기</button><h2>🔑 계정 복구</h2><p>현재 복구 코드</p><input id="recOut" readonly value="${makeExport()}"><p class="small">이 코드를 캡처해 두세요.</p><h3>다른 계정 불러오기</h3><input id="recIn" placeholder="복구 코드 입력"><button onclick="importSave()">복구하기</button>`;
}
function makeExport(){const d=btoa(unescape(encodeURIComponent(JSON.stringify(state)))).replace(/=+$/,"");return d}
function importSave(){try{const d=JSON.parse(decodeURIComponent(escape(atob(document.getElementById("recIn").value.trim()))));if(!d||typeof d.lv!=="number"||typeof d.coins!=="number")throw 0;state=d;save();closeModal();render();toast("✅ 계정 복구 완료!")}catch(e){toast("❌ 복구 코드가 올바르지 않아.")}}
function closeModal(){document.getElementById("modal").style.display="none"}
function frame(t){const dt=Math.min(.033,(t-(last||t))/1000);last=t;update(dt);draw();requestAnimationFrame(frame)}
function draw(){
 if(!running)return;ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle="#0783a5";ctx.fillRect(0,0,innerWidth,innerHeight);
 for(let i=0;i<70;i++){ctx.fillStyle="#ffffff18";ctx.beginPath();ctx.arc((i*97)%innerWidth,(i*53)%innerHeight,2,0,7);ctx.fill()}
 for(const f of foods)if(!f.dead){ctx.font="22px sans-serif";ctx.fillText("🍖",f.x,f.y)}
 for(const a of allies)if(a.hp>0){ctx.font=(34*a.r/20)+"px sans-serif";ctx.fillText(fish[a.fi].e,a.x,a.y)}
 for(const o of enemyTeam)if(o.hp>0){ctx.fillStyle="#9b63ff";ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill()}
 for(const e of enemies){ctx.fillStyle="#ef5350";ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle="#222";ctx.fillRect(e.x-18,e.y-e.r-7,36,4);ctx.fillStyle="#7cff7c";ctx.fillRect(e.x-18,e.y-e.r-7,36*Math.max(0,e.hp/e.max),4)}
 const f=fish[state.sel];let dip=attackAnim>0?Math.sin(attackAnim/.16*Math.PI)*14:0,lung=attackAnim>0?Math.sin(attackAnim/.16*Math.PI)*30:0;
 ctx.save();ctx.translate(player.x+lung,player.y+dip);ctx.font=(58*state.growth)+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(f.e,0,0);ctx.restore();
}
render();requestAnimationFrame(frame);
</script>
</body>
</html>

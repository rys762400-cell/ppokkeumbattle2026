<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>뻐끔뻐끔 배틀</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05253a;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#087da4}
#hud{position:fixed;top:8px;left:8px;right:8px;z-index:3;display:flex;gap:6px;flex-wrap:wrap}
.pill{background:#06263ddd;border:1px solid #ffffff3d;border-radius:13px;padding:7px 9px;font-size:12px;font-weight:900}
#top{position:fixed;right:8px;top:55px;z-index:5;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
button{border:0;border-radius:11px;padding:9px 11px;font-weight:900;background:#fff;color:#07304a}
#joy{position:fixed;left:20px;bottom:20px;width:122px;height:122px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55;z-index:4}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffffaa}
#attack{position:fixed;right:22px;bottom:28px;width:94px;height:94px;border-radius:50%;background:#ffd34e;color:#4d3500;font-size:18px;z-index:4}
#panel{display:none;position:fixed;inset:6%;z-index:10;background:#06263cf7;border:1px solid #ffffff55;border-radius:22px;padding:17px;overflow:auto}
#panel h2{margin:0 0 10px}.close{float:right}.card{display:inline-block;vertical-align:top;width:145px;margin:5px;padding:10px;border-radius:14px;background:#ffffff10;border:1px solid #ffffff22;min-height:95px}
#toast{display:none;position:fixed;left:50%;top:23%;transform:translateX(-50%);z-index:20;background:#062238ee;border:1px solid #ffffff55;border-radius:16px;padding:14px 18px;text-align:center;font-weight:900}
#start{position:fixed;inset:0;z-index:30;background:linear-gradient(#05283e,#087da4);display:flex;align-items:center;justify-content:center;text-align:center}
.startbox{width:min(92%,520px);padding:25px;border-radius:26px;background:#06263cee;border:1px solid #ffffff44}
.startbox h1{font-size:38px;margin:0 0 5px}.startbox p{line-height:1.55}.startbox button{font-size:18px;padding:13px 22px}
input{width:100%;padding:11px;border-radius:10px;border:0;margin:5px 0}
.small{font-size:12px;opacity:.8}
</style>
</head>
<body>
<div id="start"><div class="startbox">
<h1>🐟 뻐끔뻐끔 배틀</h1>
<p>넓은 바닷속을 탐험하고, 20초마다 강해지는 웨이브를 버티세요!</p>
<p class="small">개인용 프로토타입 · 게임 닉네임만 사용 · 실명 입력 금지</p>
<input id="nick" placeholder="게임 닉네임을 입력하세요">
<button onclick="startGame()">새로 시작합니다</button>
<button onclick="showRestore()">계정 연동합니다</button>
</div></div>

<canvas id="game"></canvas>
<div id="hud">
<div class="pill" id="wave">🌊 WAVE 1/80</div><div class="pill" id="timer">⏱️ 20</div>
<div class="pill" id="hp">❤️ 100/100</div><div class="pill" id="xp">⭐ Lv.1 0/100</div>
<div class="pill" id="coins">🪙 0</div>
</div>
<div id="top">
<button onclick="openPanel('codex')">📖 도감</button>
<button onclick="openPanel('draw')">🎰 뽑기</button>
<button onclick="openPanel('friends')">👥 친구</button>
<button onclick="openPanel('rank')">🏆 랭킹</button><button onclick="openPanel('leader')">👑 리더</button>
<button onclick="openPanel('more')">MORE</button>
</div>
<div id="joy"><div id="knob"></div></div><button id="attack">콱!<br>공격</button>
<div id="panel"></div><div id="toast"></div>

<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W,H;
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();

const WORLD={w:4200,h:2500};
let player={x:600,y:1250,r:25,hp:100,max:100,xp:0,lv:1,atk:10,def:0,coins:0,inv:0};
let cam={x:0,y:0},wave=1,remain=20,enemies=[],bubbles=[],spawn=0,bubbleTimer=5,attackCd=0;
let nickname='',started=false,region=1,selectedFish=0,drawUsed=false,reviveUsed=false;
const fish=[
['🐟','기본 물고기',10,100,'기본'],['🐠','산호 물고기',12,110,'일반'],['🦈','강철 상어',18,160,'희귀'],
['🐙','심해 문어',20,180,'희귀'],['🪼','해파리 물고기',22,190,'희귀'],['🐡','가시 복어',24,200,'희귀'],
['🐢','거대 바다거북',27,230,'특별'],['🦀','집게 물고기',30,250,'특별'],['🐋','전설의 고래',35,280,'전설'],
['🐉','전설의 해룡',45,330,'스페셜'],['🌊','바다의 주인',52,380,'스페셜'],['🐲','워터 드래곤',60,430,'스페셜'],
['🐍','대지의 주인 · 슈퍼 자이언트 바다뱀',70,480,'스페셜'],['🦑','우주의 주인 · 슈퍼 투명 오징어',82,520,'스페셜'],
['✨','환상의 물고기',100,700,'초희귀']
];
const region2=['웨이브 백 전용 1','웨이브 백 전용 2','웨이브 백 전용 3','웨이브 백 전용 4','웨이브 백 전용 5','웨이브 백 전용 6','웨이브 백 전용 7','웨이브 백 전용 8','웨이브 백 전용 9','웨이브 백 전용 10','웨이브 백 전용 11','웨이브 백 전용 12','웨이브 백 전용 13','웨이브 백 전용 14','환상의 물고기'];
let region2Unlocked=0,unlocked=2;

function startGame(){nickname=(document.querySelector('#nick').value||'플레이어').trim();started=true;document.querySelector('#start').style.display='none';toast('🐟 '+nickname+'님 환영합니다!')}
function showRestore(){alert('계정 연동 프로토타입\\n저장해 둔 복구 번호를 입력하는 기능을 연결할 수 있습니다.\\n주인 복구 번호는 게임 화면에 공개하지 않습니다.')}
function toast(s){const t=document.querySelector('#toast');t.innerHTML=s;t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',1600)}
function spawnEnemy(){let a=Math.random()*Math.PI*2,d=500+Math.random()*450,x=player.x+Math.cos(a)*d,y=player.y+Math.sin(a)*d;let hp=35+wave*4;enemies.push({x:Math.max(30,Math.min(WORLD.w-30,x)),y:Math.max(30,Math.min(WORLD.h-30,y)),r:22,hp,max:hp,spd:42+wave*.9,atk:6+wave*.42,type:Math.random()<.12?'special':'normal'})}
function bubble(){let a=[[8,5,5],[13,10,5],[18,15,25],[25,30,20]][Math.floor(Math.random()*4)];bubbles.push({x:70+Math.random()*(WORLD.w-140),y:70+Math.random()*(WORLD.h-140),r:a[0],heal:a[1],xp:a[2]})}
function level(){let need=100+(player.lv-1)*40;if(player.xp>=need){player.xp-=need;player.lv++;player.max+=10;player.hp=player.max;player.atk+=1;toast('⭐ LEVEL UP!<br>공격력 +1 · 최대 체력 +10')}}
function attack(){if(attackCd>0)return;attackCd=.42;let hit=false;for(const e of enemies){if(Math.hypot(e.x-player.x,e.y-player.y)<88){e.hp-=player.atk;hit=true;if(e.hp<=0){player.xp+=12;player.coins+=1;enemies=enemies.filter(q=>q!==e);level()}}}if(hit)toast('콱! 🐟')}
document.querySelector('#attack').onpointerdown=attack;

const joy={x:0,y:0};let joyDown=false;const je=document.querySelector('#joy'),kn=document.querySelector('#knob');
function setJoy(e){let r=je.getBoundingClientRect(),x=e.clientX-r.left-61,y=e.clientY-r.top-61,d=Math.hypot(x,y),m=43;if(d>m){x=x/d*m;y=y/d*m}joy.x=x/m;joy.y=y/m;kn.style.transform=`translate(${x}px,${y}px)`}
je.onpointerdown=e=>{joyDown=true;je.setPointerCapture(e.pointerId);setJoy(e)};je.onpointermove=e=>{if(joyDown)setJoy(e)};je.onpointerup=()=>{joyDown=false;joy.x=joy.y=0;kn.style.transform='translate(0,0)'};

function update(dt){
 if(!started)return;
 if(attackCd>0)attackCd-=dt;if(player.inv>0)player.inv-=dt;
 player.x+=joy.x*185*dt;player.y+=joy.y*185*dt;player.x=Math.max(30,Math.min(WORLD.w-30,player.x));player.y=Math.max(30,Math.min(WORLD.h-30,player.y));
 cam.x=Math.max(0,Math.min(WORLD.w-W,player.x-W/2));cam.y=Math.max(0,Math.min(WORLD.h-H,player.y-H/2));
 remain-=dt;if(remain<=0){remain=20;if(wave<80){wave++;toast('🌊 WAVE '+wave+'!<br>적이 더 강해졌습니다!')}else{toast('👑 WAVE 80 완료!<br>슈퍼 전설의 레이드 도전!')}}
 spawn-=dt;if(spawn<=0){spawn=Math.max(.5,1.75-wave*.012);spawnEnemy()}
 bubbleTimer-=dt;if(bubbleTimer<=0){bubbleTimer=5;for(let i=0;i<20;i++)bubble()}
 for(const e of enemies){let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;if(d<48&&player.inv<=0)player.hp-=e.atk*dt}
 for(const b of bubbles){if(Math.hypot(b.x-player.x,b.y-player.y)<b.r+player.r){player.hp=Math.min(player.max,player.hp+b.heal);player.xp+=b.xp;b.dead=1;level()}}
 bubbles=bubbles.filter(b=>!b.dead);
 if(player.hp<=0){if(!reviveUsed&&player.coins>0){player.coins--;reviveUsed=true;player.hp=player.max;player.inv=8;toast('✨ 마지막 부활!<br>8초 동안 무적')}else{player.hp=player.max;player.x=600;player.y=1250;toast('💫 다시 시작!')}} 
}
function drawFish(x,y,dir){ctx.save();ctx.translate(x,y);ctx.scale(dir||1,1);
 // stylized but fluid-looking fish
 ctx.fillStyle='#f5c84c';ctx.beginPath();ctx.ellipse(0,0,35,21,0,0,7);ctx.fill();
 ctx.fillStyle='#f28b3b';ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(54,-18);ctx.lineTo(54,18);ctx.closePath();ctx.fill();
 ctx.fillStyle='#f9e38d';ctx.beginPath();ctx.moveTo(-5,-18);ctx.quadraticCurveTo(0,-32,12,-19);ctx.closePath();ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(15,-7,6,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(16,-7,2.5,0,7);ctx.fill();
 ctx.restore()}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-cam.x,-cam.y);ctx.fillStyle=region===1?'#087da4':'#154b68';ctx.fillRect(0,0,WORLD.w,WORLD.h);
 for(let i=0;i<120;i++){let x=(i*311)%WORLD.w,y=(i*173)%WORLD.h;ctx.fillStyle='#ffffff18';ctx.beginPath();ctx.arc(x,y,2+(i%4),0,7);ctx.fill()}
 for(const b of bubbles){ctx.strokeStyle='#ffffffaa';ctx.fillStyle='#ffffff1c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.stroke()}
 for(const e of enemies){ctx.fillStyle=e.type==='special'?'#b95cff':'#d84b5a';ctx.beginPath();ctx.ellipse(e.x,e.y,e.r+4,e.r,0,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(e.x-25,e.y-37,50,5);ctx.fillStyle='#7cff7c';ctx.fillRect(e.x-25,e.y-37,50*Math.max(0,e.hp/e.max),5)}
 drawFish(player.x,player.y,joy.x<0?-1:1);ctx.restore();
 document.querySelector('#wave').textContent='🌊 WAVE '+wave+'/80';document.querySelector('#timer').textContent='⏱️ '+Math.ceil(remain);
 document.querySelector('#hp').textContent='❤️ '+Math.max(0,Math.ceil(player.hp))+'/'+player.max;let need=100+(player.lv-1)*40;document.querySelector('#xp').textContent='⭐ Lv.'+player.lv+' '+Math.floor(player.xp)+'/'+need;document.querySelector('#coins').textContent='🪙 '+player.coins;
}
function loop(now){let dt=Math.min(.05,(now-(loop.last||now))/1000);loop.last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);

function openPanel(kind){
 let s='<button class=close onclick=closePanel()>닫기</button>';
 if(kind==='codex'){s+='<h2>📖 도감</h2><p>해제: '+unlocked+'/15</p>';fish.forEach((f,i)=>{let ok=i<unlocked;s+=`<div class=card>${ok?f[0]:'❓'} <b>${ok?f[1]:'???'}</b><br><small>${ok?'⚔️ '+f[2]+' · ❤️ '+f[3]:'아직 해제되지 않음'}</small></div>`});s+='<p>새 물고기 해제 시 🪙 스페셜 강화 코인을 받고 공격/방어/체력 등을 강화할 수 있습니다.</p>'}
 if(kind==='draw'){s+='<h2>🎰 하루 한 번 물고기 뽑기</h2><p>하루 1회. 희귀 물고기와 스페셜 카드가 등장합니다.</p><button onclick=drawFishCard()>오늘의 뽑기</button><p class=small>✨ 환상의 물고기 특별 당첨 확률: 0.1%</p>'}
 if(kind==='friends'){s+='<h2>👥 친구 초대 모드</h2><p>게임 닉네임만 사용하세요. 실명 입력 금지.</p><p>📨 게임 초대 보내기 → 친구가 수락 → 온라인 방에서 2인 팀으로 협동 플레이</p><p>친구 요청을 처음 보낸 사람이 친구방 리더가 됩니다. 친구가 접속 중이면 온라인 방에서 함께 플레이합니다.</p><p>🪙 하루 코인 전송 · 💬 게임 팁 공유 · 🚫 수락 전 본편 잠금/체험판 1단계</p><p class=small>실제 메시지 앱 연동과 QR 초대는 웹 배포/백엔드 연결이 필요한 다음 단계입니다.</p>'}
 if(kind==='rank'){s+='<h2>🏆 친구 랭킹</h2><ol><li>'+ (nickname||'나') +' — '+(player.lv*100+wave*10)+'점</li><li>친구 A — 1,240점</li><li>친구 B — 980점</li></ol><p>친구 추가 후 친구끼리 순위를 비교합니다.</p>'}
 if(kind==='leader'){s+='<h2>👑 리더 설정</h2><p>리더 인증번호를 입력한 사람만 리더가 될 수 있습니다.</p><p><b>리더 인증번호</b></p><input id="ownerInput" inputmode="numeric" maxlength="8" placeholder="8자리 번호 입력"><button onclick="claimLeader()">리더 인증</button><hr><h3>리더 전용 설정</h3><p>🎪 이벤트 만들기 · 📢 공지사항 · 🐟 물고기 공격력/쿨타임 · 🧩 스킬 설정 · 🗺️ 이벤트 기간 설정</p><p class=small>※ 이 프로토타입에서는 인증번호가 게임 코드에 포함되어 있습니다. 실제 공개 서비스에서는 서버에서 비공개로 보관해야 합니다.</p>'}
 if(kind==='more'){s+='<h2>MORE</h2><p>📢 공지사항<br>🎪 기간 한정 이벤트<br>👑 주인 전용 이벤트 제작<br>⚙️ 설정<br>🔗 계정 연동/복구<br>🗺️ 지역 선택<br>⚔️ 슈퍼 전설의 물고기 레이드</p><hr><h3>🗺️ 지역 2 · 웨이브 백</h3><p>첫 지역 물고기는 사용할 수 없고, 이 지역 전용 물고기 14종을 모아야 15번째 환상의 물고기를 노릴 수 있습니다. 난이도는 비슷하지만 웨이브가 더 많습니다.</p><button onclick=region2Mode()>웨이브 백 체험</button><hr><h3>👑 주인 기능(설계)</h3><p>주인 인증번호로 한 명만 주인이 되고, 전화번호가 바뀌어도 별도 복구번호로 복구합니다. 주인만 이벤트 날짜·규칙·공지·캐릭터·스킬·공격력·쿨타임을 편집하고 공개 전 수정할 수 있습니다.</p><p class=small>실제 전화번호 메시지 발송/소유자 인증은 서버와 본인인증 서비스가 필요합니다.</p>'}
 document.querySelector('#panel').innerHTML=s;document.querySelector('#panel').style.display='block'
}
function closePanel(){document.querySelector('#panel').style.display='none'}
function drawFishCard(){if(drawUsed){toast('🎰 오늘 뽑기는 이미 사용했습니다.');return}drawUsed=true;let r=Math.random();if(r<.001){unlocked=15;toast('✨ 0.1% 당첨!<br>환상의 물고기 획득!')}else{let i=Math.floor(Math.random()*Math.min(14,fish.length-1));if(i>=unlocked)unlocked=Math.min(14,i+1);toast('🎉 물고기 획득!<br>'+fish[i][0]+' '+fish[i][1])}openPanel('draw')}
let isLeader=false;
const LEADER_CODE='50974266';
function claimLeader(){
 const v=(document.querySelector('#ownerInput')?.value||'').trim();
 if(v===LEADER_CODE){isLeader=true;toast('👑 리더 인증 완료!');openPanel('leader')}
 else toast('❌ 리더 인증번호가 맞지 않습니다.');
}
function region2Mode(){region=2;wave=1;remain=20;enemies=[];toast('🌊 웨이브 백 진입!<br>이 지역 전용 물고기로 도전');closePanel()}
</script>
</body></html>

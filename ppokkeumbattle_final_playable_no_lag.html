<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>뻐끔뻐끔 배틀</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05253a;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:none}
button,input{font:inherit}button{border:0;border-radius:13px;padding:11px 14px;font-weight:900}
canvas{display:none;width:100%;height:100%;background:#087da4}
#menu{position:fixed;inset:0;z-index:20;background:linear-gradient(#05283e,#087da4);overflow:auto;padding:12px 10px 90px;text-align:center}
#menu h1{font-size:31px;margin:8px 0}.preview{height:225px;display:flex;align-items:center;justify-content:center}.bigfish{font-size:140px;filter:drop-shadow(0 10px 8px #0007)}
#fishList{display:flex;gap:8px;overflow:auto;padding:8px 2px}.fishbtn{min-width:88px;height:100px;background:#06263cdd;color:#fff;border:2px solid #ffffff22}.fishbtn.sel{border-color:#ffd34e}.fishbtn.lock{filter:brightness(.35)}
#play{font-size:18px;background:#ffd34e;color:#3b2b00;margin:10px}
.card{background:#06263cdd;border:1px solid #ffffff22;border-radius:17px;padding:12px;margin:9px 0}
#companions{font-size:30px;margin:5px}.small{font-size:12px;opacity:.78}
#hud{display:none;position:fixed;top:8px;left:8px;right:8px;z-index:5;gap:6px;flex-wrap:wrap}.pill{background:#06263cdd;border:1px solid #ffffff44;border-radius:12px;padding:7px 9px;font-size:12px;font-weight:900}
#attack,#sprint,#skill{display:none;position:fixed;z-index:7;width:82px;height:82px;border-radius:50%;font-size:14px}
#attack{right:20px;bottom:25px;background:#ffd34e;color:#4b3500}#skill{right:20px;bottom:125px;background:#d8a7ff;color:#321044}#sprint{right:120px;bottom:25px;background:#7ce7ff;color:#06263c}
#joy{display:none;position:fixed;left:20px;bottom:20px;width:122px;height:122px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55;z-index:6}#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffffaa}
#levelTag{display:none;position:fixed;z-index:8;pointer-events:none;background:#06263cdd;border:1px solid #ffffff55;border-radius:10px;padding:4px 8px;font-size:12px;font-weight:900}
#panel{display:none;position:fixed;inset:7%;z-index:30;background:#06263cf7;border:1px solid #ffffff55;border-radius:20px;padding:16px;overflow:auto}
#panel input{width:100%;padding:13px;border-radius:11px;border:0;margin:7px 0;color:#111}.close{float:right}
#toast{display:none;position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:50;background:#062238ee;border:1px solid #ffffff55;border-radius:15px;padding:13px 17px;text-align:center;font-weight:900;max-width:90%}
.gacha{font-size:17px;background:#ffcf55;color:#3a2b00;width:100%}
</style>
</head>
<body>
<div id="menu">
<button onclick="openLeaderPanel()" style="position:absolute;right:10px;top:10px">👑 리더</button><h1>🐟 뻐끔뻐끔 배틀</h1>
<div class="card"><b>✏️ 닉네임</b><br><input id="nicknameInput" maxlength="12" placeholder="닉네임 입력" style="width:75%;padding:10px;border-radius:10px;border:0;color:#111"><button onclick="setNickname()">저장</button></div>
<div class="small">물고기를 고르고 전투에 출동하세요!</div>
<div class="preview"><div id="bigfish" class="bigfish">🐟</div></div>
<h2 id="fishName">기본 물고기</h2>
<div id="fishStats"></div>
<div id="companions"></div><div class="small">동료 5마리는 각각 따로 움직이고, 적에게 공격받아 먹히면 적이 성장합니다.</div>
<div class="card">
 <b>🎲 랜덤 뽑기</b><br><span class="small">코인 10개로 물고기를 뽑습니다.</span><br><br>
 <button class="gacha" onclick="gacha()">🎲 랜덤 뽑기 (10🪙)</button>
<br><button onclick="dailyGacha()" style="margin-top:8px;background:#8dffab">🎁 오늘의 무료 물고기 뽑기 (하루 1회)</button>
</div>
<div id="fishList"></div>
<button id="play" type="button">⚔️ 선택한 물고기로 전투 시작</button>
<div class="card"><b>👥 친구 & 계정</b><br>
<span class="small">친구 번호를 입력해 친구 요청을 보낼 수 있어요.</span><br>
<button onclick="friendPanel()">👥 친구 요청</button>
<button onclick="accountPanel()">☁️ 계정 이동</button></div>
</div>

<canvas id="game"></canvas>
<div id="hud"><div class="pill" id="wave">🌊 WAVE 1/80</div><div class="pill" id="timer">⏱️ 20</div><div class="pill" id="hp">❤️ 100/100</div><div class="pill" id="xp">⭐ Lv.1 0/100</div><div class="pill" id="coins">🪙 0</div></div>
<div id="joy"><div id="knob"></div></div>
<button id="sprint">💨<br>빨리 달리기</button><button id="skill">✨<br>특수 스킬</button><button id="attack">⚔️<br>공격</button>
<div id="levelTag">Lv.1</div><div id="panel"></div><div id="toast"></div>
<div id="leaderPanel" style="display:none;position:fixed;inset:7%;z-index:35;background:#06263cf7;border:1px solid #ffffff55;border-radius:20px;padding:16px;overflow:auto"></div>
<div id="friendsPanel" style="display:none;position:fixed;inset:7%;z-index:31;background:#06263cf7;border:1px solid #ffffff55;border-radius:20px;padding:16px;overflow:auto"></div>

<script>
const INITIAL_TRANSFER="878546653096";

const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H;
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
const WORLD={w:4200,h:2500};
const fish=[
 ['🐟','기본 물고기',10,100,'노랑','#ffd34e'],['🐠','산호 물고기',12,110,'파랑','#4fc3f7'],['🐡','복어',16,125,'분홍','#ff8a9b'],
 ['🦈','강철 상어',22,170,'회색','#aab7c4'],['🐙','심해 문어',25,190,'보라','#b66cff'],['🪼','해파리 물고기',27,200,'하늘','#7ce7ff'],
 ['🐢','거대 바다거북',30,230,'초록','#62d17d'],['🦀','집게 물고기',34,250,'주황','#ff9a45'],['🐋','전설의 고래',40,280,'남색','#5477ff'],
 ['🐉','전설의 해룡',50,330,'청록','#35e0c0'],['🌊','바다의 주인',58,380,'파랑','#3b9cff'],['🐲','워터 드래곤',68,430,'청록','#55e7ff'],
 ['🐍','슈퍼 자이언트 바다뱀',78,480,'초록','#76df55'],['🦑','슈퍼 투명 오징어',90,520,'보라','#d18cff'],['✨','환상의 물고기',110,700,'무지개','#fff']
];
const SAVEKEY='pbb_final_save_v1';
const FIRST_TRANSFER_NUMBER=394789031165;
let state={nickname:'플레이어',selected:0,unlocked:1,lv:1,xp:0,coins:50,food:0,growth:1,companions:[0,1,2,3,4],transferNumber:FIRST_TRANSFER_NUMBER};
try{const old=JSON.parse(localStorage.getItem(SAVEKEY)||'null');if(old)state={...state,...old};}catch(e){}
state.transferNumber=state.transferNumber||FIRST_TRANSFER_NUMBER;
let player={x:600,y:1250,r:25,hp:100,max:100,atk:10,inv:0},foods=[],enemies=[];
let started=false,wave=1,remain=20,spawn=0,attackCd=0,skillCd=0,reviveUsed=false,sprint=false,cam={x:0,y:0};
function save(){localStorage.setItem(SAVEKEY,JSON.stringify(state))}
function renderMenu(){
 document.getElementById('menu').style.display='block';
 const f=fish[state.selected],ok=state.selected<state.unlocked,b=document.getElementById('bigfish');
 b.textContent=ok?f[0]:'❓';b.style.color=ok?f[5]:'#071c28';
 document.getElementById('fishName').textContent=ok?f[1]:'???';
 document.getElementById('fishStats').innerHTML=ok?`⚔️ ${f[2]}　❤️ ${f[3]}　🎨 ${f[4]}　📏 ${state.growth.toFixed(1)}배`:'🔒 아직 해제되지 않았습니다';
 document.getElementById('companions').innerHTML='👥 동료 5마리　'+state.companions.map(i=>fish[i]?.[0]||'🐟').join(' ');
 const list=document.getElementById('fishList');list.innerHTML='';
 fish.forEach((x,i)=>{const q=document.createElement('button');q.className='fishbtn '+(i===state.selected?'sel ':'')+(i>=state.unlocked?'lock':'');q.innerHTML=(i<state.unlocked?x[0]:'❓')+'<br><small>'+(i<state.unlocked?x[1]:'???')+'</small>';q.onclick=()=>{if(i<state.unlocked){state.selected=i;save();renderMenu()}else toast('🔒 아직 해제되지 않은 물고기!')};list.appendChild(q)})
}
function startBattle(){
 if(state.selected>=state.unlocked)return;
 const f=fish[state.selected];player={x:600,y:1250,r:25*state.growth,hp:f[3]*state.growth,max:f[3]*state.growth,atk:f[2]*state.growth,inv:0};
 wave=1;remain=20;spawn=0;attackCd=0;skillCd=0;reviveUsed=false;foods=[];enemies=[];started=true;sprint=false;
 companionsLive=state.companions.slice(0,5).map((ci,i)=>({id:i,fish:ci,x:player.x+(i-2)*110,y:player.y+(i%2?95:-95),r:20,hp:fish[ci]?.[3]||100,max:fish[ci]?.[3]||100,atk:fish[ci]?.[2]||10,dead:false,grow:1,foodTimer:Math.random()*2,tx:player.x,ty:player.y}));
 opponents=[0,1,2].map((i)=>({id:i,fish:Math.min(14,Math.max(0,state.unlocked-1-i)),x:2700+i*170,y:450+i*260,r:22,hp:160,max:160,atk:14,spd:70,tx:Math.random()*4000,ty:Math.random()*2300,think:0,dead:false}));
 document.getElementById('menu').style.display='none';canvas.style.display='block';document.getElementById('hud').style.display='flex';document.getElementById('joy').style.display='block';document.getElementById('attack').style.display='block';document.getElementById('sprint').style.display='block';document.getElementById('skill').style.display='block';document.getElementById('levelTag').style.display='block';
 toast('⚔️ 전투 시작!');
}
document.getElementById('play').addEventListener('click',startBattle);
function endBattle(){started=false;enemies=[];foods=[];document.getElementById('hud').style.display='none';document.getElementById('joy').style.display='none';document.getElementById('attack').style.display='none';document.getElementById('sprint').style.display='none';document.getElementById('skill').style.display='none';document.getElementById('levelTag').style.display='none';renderMenu();toast('💫 쓰러졌어요! 메인 화면으로 돌아갑니다.')}
function spawnEnemy(){
 const a=Math.random()*Math.PI*2,d=500+Math.random()*900,hp=35+wave*4;
 const x=Math.max(40,Math.min(4160,player.x+Math.cos(a)*d)),y=Math.max(40,Math.min(2460,player.y+Math.sin(a)*d));
 enemies.push({x,y,r:22,hp,max:hp,spd:42+wave*.9,atk:6+wave*.42,special:Math.random()<.12,tx:Math.random()*4100,ty:Math.random()*2400,think:0,dead:false});
}
function enemyEatCompanions(){
 for(const e of enemies){
  for(const c of companionsLive){
   if(c.dead)continue;
   if(Math.hypot(e.x-c.x,e.y-c.y)<e.r+c.r+5){
    c.hp-=e.atk*0.12;
    if(c.hp<=0){
      c.dead=true;
      e.grow=(e.grow||1)+0.12;
      e.r=Math.min(52,e.r*1.06);
      e.hp=e.max=Math.round(e.max*1.10);
      toast('👾 적이 동료 '+(c.id+1)+'번을 먹고 커졌어!');
    }
   }
  }
 }
}


function autonomousAI(dt){
 for(const e of enemies){
  if(e.dead)continue;
  e.think-=dt;
  if(e.think<=0){e.think=.7+Math.random()*1.8;e.tx=Math.random()*4100+50;e.ty=Math.random()*2350+50}
  const nearby= Math.hypot(e.x-player.x,e.y-player.y)<330;
  let target=null,best=1e9;
  // Enemies may opportunistically chase a nearby companion/player, but don't all stick to player.
  const targets=[player,...companionsLive.filter(c=>!c.dead)];
  for(const t of targets){const d=Math.hypot(t.x-e.x,t.y-e.y);if(d<best&&d<420){best=d;target=t}}
  const tx=target?target.x:e.tx,ty=target?target.y:e.ty;
  const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1;
  const steer=target?1:.45;
  e.x+=dx/d*e.spd*steer*dt;e.y+=dy/d*e.spd*steer*dt;
  e.x=Math.max(30,Math.min(4170,e.x));e.y=Math.max(30,Math.min(2470,e.y));
 }
 for(const o of opponents){
  if(o.dead)continue;o.think-=dt;
  if(o.think<=0){o.think=.8+Math.random()*2;o.tx=Math.random()*4000+100;o.ty=Math.random()*2300+100}
  // Opposing AI freely roams, sometimes attacks the player/team if nearby.
  let target=player,td=Math.hypot(player.x-o.x,player.y-o.y);
  for(const c of companionsLive){if(c.dead)continue;const d=Math.hypot(c.x-o.x,c.y-o.y);if(d<td){td=d;target=c}}
  const useTarget=td<360 && Math.random()<.32;
  const tx=useTarget?target.x:o.tx,ty=useTarget?target.y:o.ty;
  const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy)||1;
  o.x+=dx/d*o.spd*dt;o.y+=dy/d*o.spd*dt;
  if(useTarget&&td<55){if(target===player){if(player.inv<=0)player.hp-=o.atk*dt}else target.hp-=o.atk*dt}
  // Opponent attacks nearby enemies too, making teams fight autonomously.
  for(const e of enemies){if(e.dead)continue;const d=Math.hypot(e.x-o.x,e.y-o.y);if(d<75)e.hp-=o.atk*.25*dt}
 }
 enemies=enemies.filter(e=>!e.dead);
 opponents=opponents.filter(o=>!o.dead);
}

function update(dt){
 if(!started)return;
 if(attackCd>0)attackCd-=dt;if(attackAnim>0)attackAnim-=dt;if(skillCd>0)skillCd-=dt;if(player.inv>0)player.inv-=dt;
 const speed=sprint?360:185;player.x=Math.max(30,Math.min(WORLD.w-30,player.x+joy.x*speed*dt));player.y=Math.max(30,Math.min(WORLD.h-30,player.y+joy.y*speed*dt));
 cam.x=Math.max(0,Math.min(WORLD.w-W,player.x-W/2));cam.y=Math.max(0,Math.min(WORLD.h-H,player.y-H/2));
 remain-=dt;if(remain<=0){remain=20;if(wave<80){wave++;toast('🌊 WAVE '+wave+'!')}}
 spawn-=dt;if(spawn<=0){spawn=Math.max(.5,1.7-wave*.012);spawnEnemy()}
 if(Math.random()<dt*.28&&foods.length<8)foods.push({x:Math.max(30,Math.min(WORLD.w-30,player.x+(Math.random()*700-350))),y:Math.max(30,Math.min(WORLD.h-30,player.y+(Math.random()*500-250))),r:9});
 for(const food of foods){if(Math.hypot(food.x-player.x,food.y-player.y)<food.r+player.r){food.dead=true;state.food++;state.growth=Math.min(2.2,state.growth+.03);player.r=Math.min(46,25*state.growth);player.max+=1;player.hp=Math.min(player.max,player.hp+3);player.atk+=.4;toast('🍖 먹이! 몸집이 커졌어!')}}
 foods=foods.filter(f=>!f.dead);
 for(const e of enemies){let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;if(d<48&&player.inv<=0)player.hp-=e.atk*dt}
 if(player.hp<=0){if(!reviveUsed&&state.coins>0){state.coins--;reviveUsed=true;player.hp=player.max;player.inv=8;toast('✨ 부활!')}else{save();endBattle()}}
 saveTimer-=dt;if(saveTimer<=0){save();saveTimer=999}document.getElementById('wave').textContent='🌊 WAVE '+wave+'/80';document.getElementById('timer').textContent='⏱️ '+Math.ceil(remain);document.getElementById('hp').textContent='❤️ '+Math.max(0,Math.ceil(player.hp))+'/'+Math.ceil(player.max);document.getElementById('xp').textContent='⭐ Lv.'+state.lv+' '+state.xp+'/'+(100+(state.lv-1)*40);document.getElementById('coins').textContent='🪙 '+state.coins;
 document.getElementById('levelTag').textContent='Lv.'+state.lv;document.getElementById('levelTag').style.left=Math.max(4,player.x-cam.x-20)+'px';document.getElementById('levelTag').style.top=Math.max(4,player.y-cam.y-55)+'px';
}
function drawFish(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle=fish[state.selected][5];ctx.font=(58*state.growth)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(fish[state.selected][0],0,0);ctx.restore()}
function draw(){
 ctx.clearRect(0,0,W,H);if(!started)return;ctx.save();ctx.translate(-cam.x,-cam.y);ctx.fillStyle='#087da4';ctx.fillRect(0,0,WORLD.w,WORLD.h);
 for(let i=0;i<90;i++){ctx.fillStyle='#ffffff18';ctx.beginPath();ctx.arc((i*311)%WORLD.w,(i*173)%WORLD.h,2+(i%4),0,7);ctx.fill()}
 for(const food of foods){ctx.font='25px sans-serif';ctx.textAlign='center';ctx.fillText('🍖',food.x,food.y)}
 
 for(const o of opponents){ctx.font='46px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐠',o.x,o.y);ctx.fillStyle='#ff7c7c';ctx.fillRect(o.x-22,o.y-31,44,4);ctx.fillStyle='#7cff7c';ctx.fillRect(o.x-22,o.y-31,44*Math.max(0,o.hp/o.max),4)}
 for(const e of enemies){ctx.font='48px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=e.special?'#d66cff':'#ff6b6b';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(e.x-25,e.y-37,50,5);ctx.fillStyle='#7cff7c';ctx.fillRect(e.x-25,e.y-37,50*Math.max(0,e.hp/e.max),5)}
 drawFish(player.x,player.y);ctx.restore();
}
function loop(t){let dt=Math.min(.05,(t-(loop.last||t))/1000);loop.last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);

function gacha(){
 if(state.coins<10){toast('🪙 코인이 부족해!');return}
 state.coins-=10;const i=Math.floor(Math.random()*fish.length);
 if(i>=state.unlocked){state.unlocked=Math.min(fish.length,i+1);toast('🎉 '+fish[i][0]+' '+fish[i][1]+' 해제!')}
 else toast('🎲 '+fish[i][0]+' '+fish[i][1]+' 획득!');
 save();renderMenu();
}

function friendPanel(){
 const p=document.getElementById('friendsPanel');p.style.display='block';
 const friends=JSON.parse(localStorage.getItem('pbb_friends')||'[]');
 p.innerHTML='<button style="float:right" onclick="document.getElementById(\'friendsPanel\').style.display=\'none\'">닫기</button>'+
 '<h2>👥 친구</h2><p>친구의 <b>계정 번호</b>를 입력하면 친구 요청을 만들 수 있어.</p>'+
 '<input id="friendNumber" inputmode="numeric" placeholder="친구 계정 번호 입력" style="width:100%;padding:13px;border-radius:11px;border:0;margin:7px 0;color:#111">'+
 '<button onclick="sendFriendRequest()">📨 친구 요청 보내기</button>'+
 '<h3>📋 내 친구 목록</h3><div id="friendList">'+(friends.length?friends.map(x=>'👤 '+x).join('<br>'):'아직 친구가 없어.')+'</div>'+
 '<p class="small">※ 현재 단일 HTML 버전에서는 실제 인터넷을 통한 친구 요청 전송은 서버 연결이 필요해. 아래 기능은 이 기기에서 요청/목록을 관리해.</p>';
}
function sendFriendRequest(){
 const n=(document.getElementById('friendNumber')?.value||'').replace(/\D/g,'');
 if(n.length<6){toast('❌ 올바른 계정 번호를 입력해 줘.');return}
 const arr=JSON.parse(localStorage.getItem('pbb_friend_requests')||'[]');
 if(!arr.includes(n))arr.push(n);
 localStorage.setItem('pbb_friend_requests',JSON.stringify(arr));
 toast('📨 친구 요청을 만들었어!');
 friendPanel();
}


const LEADER_CODE='50974266';
let leaderAuthed=false,saveTimer=0;
function openLeaderPanel(){
 const p=document.getElementById('leaderPanel');p.style.display='block';
 if(leaderAuthed){
  p.innerHTML='<button style="float:right" onclick="closeLeader()">닫기</button><h2>👑 리더 인증 완료</h2>'+
   '<p>주인 전용 메뉴에 들어왔어.</p><h3>🤖 AI 게임 업데이트</h3>'+
   '<input id="aiReq" placeholder="예: 새 보스 물고기를 추가해줘" style="width:100%;padding:12px;border-radius:10px;border:0">'+

function switchBackAccount(){
 const h=JSON.parse(localStorage.getItem('pbb_account_history')||'[]');
 if(!h.length){toast('↩️ 돌아갈 이전 계정이 없어.');return}
 const current={...state};
 const prev=h.shift();
 h.unshift(current);
 localStorage.setItem('pbb_account_history',JSON.stringify(h.slice(0,5)));
 state=prev;save();document.getElementById('panel').style.display='none';renderMenu();toast('↩️ 이전 계정으로 돌아왔어!');
}

function makeTransferNumber(){
 const data={v:1,n:state.nickname,s:state.selected,u:state.unlocked,l:state.lv,x:state.xp,c:state.coins,f:state.food,g:Number(state.growth.toFixed(3)),m:state.companions,t:state.transferNumber||FIRST_TRANSFER_NUMBER};
 return btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/=+$/,'');
}
async function copyTransfer(){const v=document.getElementById('transferOut').value;try{await navigator.clipboard.writeText(v);toast('📋 이동 번호를 복사했어!')}catch(e){toast('번호를 길게 눌러 복사해 줘.')}}
function importTransfer(){
 const v=(document.getElementById('transferIn').value||'').trim();try{
  const d=JSON.parse(decodeURIComponent(escape(atob(v))));
  if(!d||d.v!==1||typeof d.l!=='number'||typeof d.c!=='number')throw 0;
  const history=JSON.parse(localStorage.getItem('pbb_account_history')||'[]');
 history.unshift({...state});localStorage.setItem('pbb_account_history',JSON.stringify(history.slice(0,5)));
 state={nickname:d.n||'플레이어',selected:Math.max(0,Math.min(fish.length-1,Number(d.s)||0)),unlocked:Math.max(1,Math.min(fish.length,Number(d.u)||1)),lv:Math.max(1,Number(d.l)||1),xp:Math.max(0,Number(d.x)||0),coins:Math.max(0,Number(d.c)||0),food:Math.max(0,Number(d.f)||0),growth:Math.max(1,Math.min(2.2,Number(d.g)||1)),companions:Array.isArray(d.m)?d.m:[0,1,2,3,4],transferNumber:d.t||FIRST_TRANSFER_NUMBER};
  state.companions=state.companions.filter(i=>Number.isInteger(i)&&i>=0&&i<fish.length).slice(0,5);while(state.companions.length<5)state.companions.push(state.companions.length);
  if(state.selected>=state.unlocked)state.selected=0;save();document.getElementById('panel').style.display='none';renderMenu();toast('✅ 계정 이동 완료!');
 }catch(e){toast('❌ 올바른 계정 이동 번호가 아니야.')}
}
renderMenu();
</script>

<script>
